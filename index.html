<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lớp 10 Chuyên Tin - Bảng điều khiển giáo viên</title>

  <!-- Google Fonts với hỗ trợ Tiếng Việt hoàn hảo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- External CSS Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  
  <!-- Custom Modular Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- External JS Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">10CT</div>
      <div class="brand-copy">
        <div class="brand-name">10 Chuyên Tin</div>
        <span class="brand-subtitle">Bảng điều khiển giáo viên</span>
      </div>
    </div>
    <nav id="sideNav"></nav>
    <button id="authBtn" class="guide-btn" onclick="window.app.toggleAuth()"><i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập</button>
  </aside>

  <!-- Main Content Wrap -->
  <main class="main-wrap">
    <!-- Topbar Header -->
    <header class="topbar">
      <div class="page-title">
        <h1 id="pageTitle">Trang chủ</h1>
        <p id="pageSubtitle">Tổng quan nhanh tình hình lớp học hôm nay</p>
      </div>
      <div class="top-actions">
        <div class="modern-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Chuyển đổi giao diện">
          <div class="toggle-track">
            <div class="toggle-indicator"></div>
            <div class="toggle-option teal-opt"><i class="fa-solid fa-leaf"></i> Xanh</div>
            <div class="toggle-option warm-opt"><i class="fa-solid fa-fire"></i> Nâu</div>
          </div>
        </div>
        <div class="save-pill" id="savePill"><i class="fa-solid fa-circle-check me-1"></i>Đã lưu</div>
        <select class="class-switcher" id="classSwitcher" onchange="switchClass(this.value)"></select>
        <div class="teacher-mini">
          <div class="avatar" id="teacherAvatarMini"></div>
          <div>
            <strong id="teacherNameMini">Giáo viên</strong>
            <small id="teacherRoleMini">Giáo viên</small>
          </div>
        </div>
      </div>
    </header>
    
    <!-- Main Content Area -->
    <section class="main-content fade-in" id="appContent"></section>
  </main>
</div>

<!-- Mobile Menu FAB -->
<button class="fab-mobile" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

<!-- Global Bootstrap Modal -->
<div class="modal fade" id="mainModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mainModalTitle">Cập nhật</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="mainModalBody"></div>
    </div>
  </div>
</div>

<!-- Hidden Input for Data Import -->
<input type="file" id="hiddenImport" accept="application/json" hidden>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App Entry Point Module -->
<script type="module" src="js/app.js"></script>
</body>
</html>
